<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Portrait (Mobile) Layout - 16:8 ratio */
        @media (orientation: portrait) {
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 15px;
                padding: 15px;
            }
            
            /* Specific layout for portrait */
            .logo-container {
                grid-column: 1 / span 2;
                text-align: center;
                margin-bottom: 15px;
            }
            
            .profile-container {
                grid-column: 1;
                text-align: center;
            }
            
            .info-container {
                grid-column: 2;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .marquee-container {
                grid-column: 1 / span 2;
                margin: 15px 0;
            }
            
            .points-container {
                grid-column: 1 / span 2;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 15px;
                margin: 15px 0;
            }
            
            .buttons-container {
                grid-column: 1 / span 2;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 15px;
            }
        }

        /* Landscape (Desktop/TV) Layout - 10:16 ratio */
        @media (orientation: landscape) {
            .grid {
                display: grid;
                grid-template-columns: repeat(16, 1fr);
                grid-template-rows: repeat(10, 1fr);
                grid-gap: 10px;
                height: 90vh;
                padding: 20px;
            }
            
            /* Top row: B C A E F */
            .logo-container {
                grid-column: 9 / span 2;
                grid-row: 1;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .profile-container {
                grid-column: 1 / span 3;
                grid-row: 1;
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .info-container {
                grid-column: 4 / span 4;
                grid-row: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding-left: 20px;
            }
            
            .points-container {
                grid-column: 11 / span 6;
                grid-row: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 10px;
            }
            
            /* Marquee row */
            .marquee-container {
                grid-column: 1 / span 16;
                grid-row: 2;
                margin: 10px 0;
            }
            
            /* Bottom buttons */
            .buttons-container {
                grid-column: 1 / span 16;
                grid-row: 3 / span 8;
                display: grid;
                grid-template-columns: repeat(8, 1fr);
                grid-template-rows: repeat(4, 1fr);
                grid-gap: 15px;
            }
        }

        /* Common Styles */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            max-width: 120px;
            height: auto;
            border-radius: 10px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
            margin: 0 auto 15px;
        }

        .name {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .department, .position {
            font-size: 1.2em;
            color: #7f8c8d;
            margin: 5px 0;
        }

        .marquee {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 30s linear infinite;
            padding-left: 100%;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .point-card {
            text-align: center;
            padding: 25px 15px;
        }

        .point-label {
            font-size: 1.1em;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .point-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #e74c3c;
        }

        .button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }

        .button:active {
            transform: translateY(-1px);
        }

        .hidden-form {
            display: none;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 1.5em;
            color: #333;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .name {
                font-size: 2em;
            }
            
            .point-value {
                font-size: 2em;
            }
            
            .button {
                padding: 15px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 1.8em;
            }
            
            .profile-pic {
                width: 100px;
                height: 100px;
            }
            
            .button {
                padding: 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading" class="loading">Loading...</div>

    <div class="container">
        <div class="grid">
            <!-- A: HL Logo -->
            <div class="logo-container card">
                <img src="data:image/webp;base64,..." alt="Logo" class="logo">
            </div>

            <!-- Profile Section -->
            <div class="profile-container card">
                <img src="profile-pic.jpg" alt="Profile Picture" class="profile-pic">
                <div class="name" id="employeeNameDisplay">John Doe</div>
                <div class="department">Engineering</div>
                <div class="position">Software Engineer</div>
            </div>

            <!-- Info Section -->
            <div class="info-container card">
                <p>Some info here...</p>
            </div>

            <!-- Points Section -->
            <div class="points-container">
                <div class="point-card card">
                    <div class="point-label">Total Points</div>
                    <div class="point-value" id="totalPoints">3000</div>
                </div>
                <div class="point-card card">
                    <div class="point-label">Remaining Points</div>
                    <div class="point-value" id="remainingPoints">3000</div>
                </div>
            </div>

            <!-- Buttons Section -->
            <div class="buttons-container">
                <button class="button" id="redeemButton">Redeem Reward</button>
                <button class="button" onclick="alert('Another button')">Another Action</button>
            </div>
        </div>
    </div>

    <script>
        // Hide loading after page loads
        window.addEventListener('load', () => {
            document.getElementById('loading').style.display = 'none';
        });

        // Redeem button click - go to redeem.html with GET param
        document.getElementById('redeemButton').addEventListener('click', () => {
            const name = encodeURIComponent(document.getElementById('employeeNameDisplay').textContent.trim());
            window.location.href = `redeem.html?name=${name}`;
        });
    </script>
</body>
</html>
